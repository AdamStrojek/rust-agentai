[package]
name = "agentai-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Adam Strojek <adam@strojek.info>"]
license = "MIT"
repository = "https://github.com/AdamStrojek/rust-agentai"
description = "Shared building blocks of the AgentAI crates, such as the HTTP client abstraction."
readme = "README.md"
categories = ["web-programming::http-client"]
keywords = ["generative-ai", "agent", "http"]

[dependencies]
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", optional = true }
document-features = { version = "0.2" }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["full"] }

[features]
default = ["reqwest"]
#! Available features for `agentai-core` crate.
#!
#! Features list:
#!

## Enables [`ReqwestClient`](crate::ReqwestClient), the [`HttpClient`](crate::HttpClient) on top of `reqwest`
reqwest = ["dep:reqwest"]
