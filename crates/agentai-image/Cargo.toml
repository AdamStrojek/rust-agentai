[package]
name = "agentai-image"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Adam Strojek <adam@strojek.info>"]
license = "MIT"
repository = "https://github.com/AdamStrojek/rust-agentai"
description = "Image generation and editing tools for AgentAI agents."
readme = "README.md"
categories = ["multimedia::images"]
keywords = ["generative-ai", "agent", "image-generation", "openai"]

[dependencies]
agentai = { path = "../agentai", version = "0.4", default-features = false, optional = true }
agentai-core = { path = "../agentai-core", version = "0.4" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2", features = ["derive"], optional = true }
thiserror = "2.0.21"
base64 = "0.23"
document-features = { version = "0.2" }

[dev-dependencies]
agentai = { path = "../agentai", version = "0.4" }
anyhow = "1.0.104"
tokio = { version = "1.54.0", features = ["full"] }

[features]
default = ["toolbox"]
#! Available features for `agentai-image` crate.
#!
#! Features list:
#!

## Enables the agent tools: [`GenerateImageToolBox`](crate::GenerateImageToolBox) and
## [`ReadMediaToolBox`](crate::ReadMediaToolBox). Without it the crate has only
## [`ImageGenerator`](crate::ImageGenerator) and does not depend on `agentai`.
toolbox = ["dep:agentai", "dep:schemars"]

[[example]]
name = "image_tools"
required-features = ["toolbox"]
