[package]
name = "agentai-image"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Adam Strojek <adam@strojek.info>"]
license = "MIT"
repository = "https://github.com/AdamStrojek/rust-agentai"
description = "Image generation and editing tools for AgentAI agents."
readme = "README.md"
categories = ["multimedia::images"]
keywords = ["generative-ai", "agent", "image-generation", "openai"]

[dependencies]
agentai = { path = "../agentai", version = "0.4", default-features = false }
agentai-core = { path = "../agentai-core", version = "0.4" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2", features = ["derive"] }
thiserror = "2.0.21"
base64 = "0.23"
log = "0.4.34"

[dev-dependencies]
agentai = { path = "../agentai", version = "0.4" }
anyhow = "1.0.104"
tokio = { version = "1.54.0", features = ["full"] }
