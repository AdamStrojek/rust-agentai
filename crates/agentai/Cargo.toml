[package]
name = "agentai"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Adam Strojek <adam@strojek.info>"]
license = "MIT"
repository = "https://github.com/AdamStrojek/rust-agentai"
description = "AgentAI is a Rust library designed to simplify the creation of AI agents."
readme = "../../README.md"
categories = ["text-processing"]
keywords = ["generative-ai", "openai", "chatgpt", "gemini", "agent"]
exclude = ["release-plz.toml", ".github"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
agentai-macros = { path = "../agentai-macros", version = "0.4", optional = true }
genai = { version = "0.7", default-features = false }
agentai-core = { path = "../agentai-core", version = "0.4", default-features = false }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2", features = ["derive"] }
async-trait = "0.1.92"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "query",
    "charset",
    "http2",
] }
rmcp = { version = "3.6", optional = true, default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1.54.0", optional = true, features = ["process"] }
document-features = { version = "0.2" }
time = { version = "0.3", features = [
    "serde",
    "formatting",
    "parsing",
    "local-offset",
    "macros",
], optional = true }
time-tz = { version = "2.0.0", optional = true }
async-stream = "0.3.6"
base64 = "0.23"
futures-util = { version = "0.3.34", features = ["io"] }

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.0", features = ["full"] }
simplelog = "0.12.2"

[features]
default = [
    "rustls-ring",
    "system-proxy",
    "mcp-client",
    "macros",
    "tokio",
    "tools-buildin",
    "tools-web",
]
#! Available features for `agentai` crate.
#! To enable any of these features, you need to enter this command:
#!
#! ```bash
#! cargo add agentai -F mcp-client
#! ```
#!
#! Features list:
#!

## TLS with rustls and the ring crypto provider, checking certificates against the OS trust
## store. The library installs ring as the process-wide rustls provider when it builds a client;
## call [`tls::install_crypto_provider`](crate::tls::install_crypto_provider) before you build
## your own `genai::Client` or `reqwest::Client`.
rustls-ring = ["agentai-core/rustls-ring", "reqwest/rustls-no-provider"]
## TLS with rustls and the aws-lc-rs crypto provider (builds the `aws-lc-sys` C library).
rustls-aws-lc = ["agentai-core/rustls-aws-lc", "reqwest/rustls", "genai/rustls-tls"]
## TLS of the operating system (OpenSSL, SChannel or Security Framework). It cannot be combined
## with a `rustls-*` feature: set `default-features = false`.
native-tls = ["agentai-core/native-tls", "reqwest/native-tls", "genai/native-tls"]
## Reads the macOS and Windows system proxy settings. Proxy environment variables
## (`HTTP_PROXY`, `HTTPS_PROXY`, `NO_PROXY`) work without it.
system-proxy = ["agentai-core/system-proxy", "reqwest/system-proxy", "genai/system-proxy"]

## Enables support for Agent Tools served by MCP servers (stdio and Streamable HTTP, via `rmcp`)
mcp-client = ["dep:rmcp", "dep:tokio"]
## Enables tokio integrations, such as writing a stream to a tokio writer with
## [`AgentStream::print_to_tokio`](crate::AgentStream::print_to_tokio)
tokio = ["dep:tokio"]
## Enables support for macro [`#[toolbox]`](crate::tool::toolbox)
macros = ["agentai-macros"]
## Enables support for [buildin tools](crate::tool::buildin)
tools-buildin = ["macros", "time", "time-tz"]
## Enables support for [web tools](crate::tool::web)
tools-web = ["macros"]
