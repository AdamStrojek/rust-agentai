name: Claude Review

# Adding the `claude-review` label to a pull request asks Claude for a code review.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.actor == 'AdamStrojek' && github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow CLAUDE.md. Focus on correctness bugs, API
            breakage that is not intentional, unsafe error handling (unwrap/todo! in library
            code), and missing docs or examples for new public items.

            Post specific issues as inline comments and finish with one summary comment.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo check:*),Bash(cargo clippy:*)"
