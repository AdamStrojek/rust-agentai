name: Claude Review

# Adding the `claude-review` label to a pull request asks Claude for a code review.
#
# `pull_request_target` runs in this repository's context, so the review also works
# for pull requests from forks (`pull_request` gets no secrets and a read-only token
# there). It has secrets, so the PR's code must never run: the checkout stays on the
# base branch (only for CLAUDE.md) and Claude reads the change through `gh pr diff`,
# with no cargo commands allowed. The Claude GitHub App token exchange rejects this
# event, so the action uses the workflow's `GITHUB_TOKEN` (comments come from
# github-actions[bot]).
on:
  pull_request_target:
    types: [labeled]

jobs:
  review:
    if: github.actor == 'AdamStrojek' && github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow CLAUDE.md. Focus on correctness bugs, unsafe
            error handling (unwrap/todo! in library code), and missing docs or examples for
            new public items.

            Backward compatibility: compare the public API of `agentai` and `agentai-macros`
            against the base branch. List every breaking change: removed or renamed public
            items, changed signatures, trait bounds or generic parameters, new required trait
            methods, removed or renamed Cargo features, and changed runtime behaviour of
            `Agent::run`, `ToolBox`, `#[toolbox]` or memory. For each, say what a library
            user has to change in their code. The crate is pre-1.0, so breaking changes are
            allowed: report them as changelog notes, not as defects, unless they look
            unintended. Say explicitly when the PR has no breaking changes.

            Post specific issues as inline comments and finish with one summary comment
            that has a "Breaking changes" section.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
