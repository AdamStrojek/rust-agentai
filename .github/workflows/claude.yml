name: Claude Code

# Claude answers only when the repository owner asks for it:
# - a comment, review or issue mentioning `@claude`,
# - the `claude` label added to an issue.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    if: |
      github.actor == 'AdamStrojek' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash(cargo build:*),Bash(cargo check:*),Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo doc:*),Bash(cargo run --example:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*)"
            --append-system-prompt "Pull requests: never open one on your own. When you finish work on a branch, end your comment with a short summary of the changes and verification and ask the maintainer to review the branch, then stop. Open a pull request with gh pr create only when the triggering comment from the maintainer explicitly approves it (for example '@claude open PR' or '@claude create the pull request'). First check with gh pr list --head <branch> that no PR exists for that branch. Use the <type>(<scope>): <message> title format from CONTRIBUTING.md, write the description in English, and include 'Closes #<issue>' when the work comes from an issue."
        env:
          AGENTAI_BASE_URL: https://openrouter.ai/api/v1/
          AGENTAI_MODEL: nvidia/nemotron-3.5-super-vl:free
          AGENTAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
